# ===========================================================================
# P1 Preprocess Config — full-atom baseline (no symmetry compression)
# ===========================================================================
#
# Every atom becomes its own orbit (K=M, multiplicity=1).
# Uses the same Wyckoff graph schema so the existing encoder works unchanged.
#
# --- JARVIS bandgap P1 ---
#   sbatch jobs/preprocess.slurm configs/preprocess_p1.yaml
#
# --- JARVIS formation energy P1 ---
#   sbatch jobs/preprocess.slurm configs/preprocess_p1.yaml --override \
#     "dataset.adapter_kwargs.target_key=formation_energy_peratom" \
#     "preprocess.cache_dir=data/processed/jarvis_lmdb_formation_energy_peratom_p1"
#
# ===========================================================================

# --- Dataset source ---
dataset:
  adapter: jarvis
  adapter_kwargs:
    json_path: data/jarvis_raw/jdft_3d-9-24-2025.json
    target_key: optb88vdw_bandgap
  split:
    type: random
    train_ratio: 0.8
    val_ratio: 0.1
    seed: 42

# --- Graph builder ---
graph:
  type: p1                          # P1: every atom = own orbit, no compression
  cutoff: 5.0                       # same cutoff as Wyckoff for fair comparison

# --- Preprocess options ---
preprocess:
  cache_dir: data/processed/jarvis_lmdb_bandgap_p1
  resume: true
  max_records: null
  skip_failed: true
  num_workers: 8
  chunksize: 16
