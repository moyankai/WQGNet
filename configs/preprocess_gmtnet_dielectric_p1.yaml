# GMTNet dielectric tensor — P1 full-atom graph (control)
dataset:
  adapter: gmtnet_dielectric
  adapter_kwargs:
    pkl_path: data/processed/gmtnet_dielectric/gmtnet_dielectric_filtered.pkl
    split_file: data/processed/gmtnet_dielectric/split_seed32.json
  split:
    type: none

graph:
  type: atom
  cutoff: 5.0

preprocess:
  cache_dir: data/processed/gmtnet_dielectric_p1
  resume: true
  max_records: null
  skip_failed: true
  num_workers: 8
  chunksize: 16
