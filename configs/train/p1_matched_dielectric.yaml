# WQGNet-Full on matched P1 graph: dielectric tensor (controlled baseline)
# Same conventional cell / split / protocol as WQGNet-Full. Every atom a node.

dataset: jarvis_leaderboard
task: dielectric_tensor
property_name: dielectric_tensor
property_type: graph_tensor
output_type: symmetric_rank2

manifest_path: data/processed/gmtnet_dielectric_p1_stdframe_v2/manifest.jsonl
shard_dir: data/processed/gmtnet_dielectric_p1_stdframe_v2
graph_type: wyckoff

model_type: unified_quotient_equivariant
block_type: dynamic_tp
hidden_irreps: "128x0e + 16x1o + 8x2e"
use_site_irrep_projection: true
site_projector_path: data/symmetry/site_irrep_tables/invariant_basis/site_projectors_lmax8.pt
site_irrep_lmax: 8
apply_site_projection: each_layer

num_layers: 5
num_rbf: 32
rbf_max: 8.0

tensor_point_group_projection: false
use_source_image_transport: true
loss: mae

epochs: 200
patience: 0
lr: 5e-4
lr_stop: 1e-5
lr_power: 1.0
weight_decay: 1.0e-5
grad_clip: 5.0
scheduler: polynomial
ema: false
dropout: 0.0

batch_size: 64
val_batch_size: 128
num_workers: 8
pin_memory: true
persistent_workers: true
prefetch_factor: 2
torch_compile: false
global_max_mult: 192

log_every_n_batches: 50
seed: 0
output_dir: auto
output_root: results
timestamp_output: true
device: auto
