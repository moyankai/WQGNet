# QMOF PBE band-gap — P1 matched baseline
# Identical architecture/hyperparameters to the WQGNet counterpart.

dataset: qmof
task: bandgap_pbe
property_name: bandgap_pbe
property_type: graph_scalar_intensive

manifest_path: data/processed/qmof_bandgap_p1/manifest.jsonl
shard_dir: data/processed/qmof_bandgap_p1
graph_type: p1

model_type: unified_quotient_equivariant
block_type: dynamic_tp
hidden_irreps: "128x0e + 4x1o"

use_site_irrep_projection: true
site_projector_path: data/symmetry/site_irrep_tables/invariant_basis/site_projectors_lmax8.pt
site_irrep_lmax: 8
apply_site_projection: each_layer
unknown_projector_policy: identity
missing_irrep_policy: identity

num_layers: 5
num_rbf: 32
rbf_max: 8.0

angular_lr_factor: 0.2
angular_weight_decay: 1.0e-3

epochs: 200
lr: 5e-4
lr_stop: 1e-5
lr_power: 1.0
weight_decay: 1.0e-5
loss: mae
grad_clip: 5.0
scheduler: polynomial
ema: false
dropout: 0.0

batch_size: 32
val_batch_size: 64
num_workers: 4
pin_memory: true
persistent_workers: true
torch_compile: false
global_max_mult: 192

log_every_n_batches: 50
seed: 0
output_dir: results/qmof_bandgap_p1_s0
device: auto
