# UnifiedQuotientEquivariantGNN — 5-epoch smoke test
# Model: Scalar (128x0e) + high-l (8x1o + 4x2e) = ~848K params
# Coupling: zero-init high-l → scalar correction (per-copy ||h_c^(l)||^2)

dataset: jarvis_leaderboard
task: formation_energy_peratom
property_name: formation_energy_peratom
property_type: graph_scalar_intensive

manifest_path: data/processed/jarvis_lmdb_formation_energy_peratom/manifest.jsonl
shard_dir: data/processed/jarvis_lmdb_formation_energy_peratom
graph_type: wyckoff
leaderboard_split_zip: data/jarvis_leaderboard/dft_3d_formation_energy_peratom.json.zip

model_type: unified_quotient_equivariant
hidden_irreps: "128x0e + 8x1o + 4x2e"
num_layers: 5
num_rbf: 32
rbf_max: 8.0

epochs: 5
lr: 5e-4
lr_stop: 1e-5
lr_power: 1.0
weight_decay: 1.0e-5
loss: mae
grad_clip: 5.0
scheduler: polynomial
ema: false
dropout: 0.0

batch_size: 256
val_batch_size: 256
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 2
torch_compile: false
global_max_mult: 192

log_every_n_batches: 50
seed: 0
output_dir: auto
output_root: results
timestamp_output: true
device: auto
