# GMTNet piezoelectric tensor — Wyckoff quotient graph (std tensor frame)
dataset:
  adapter: gmtnet_piezo
  adapter_kwargs:
    pkl_path: data/processed/gmtnet_piezo/gmtnet_piezo_filtered.pkl
    split_file: data/processed/gmtnet_piezo/split_seed32.json
  split:
    type: none

graph:
  type: wyckoff
  cutoff: 5.0
  symprec: 1.0e-5
  angle_pair_top_k: 0
  rotate_tensor_to_std: true

preprocess:
  cache_dir: data/processed/gmtnet_piezo_wyckoff_stdframe
  resume: true
  max_records: null
  skip_failed: true
  num_workers: 8
  chunksize: 16
  fail_closed_splits: false
